name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# Отменяем устаревшие прогоны на той же ветке.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: ruff + pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 — заявленный минимум (requires-python >=3.13).
        # Прогон на 3.13 важен отдельно: в 3.14 аннотации ленивые (PEP 649),
        # и ошибки вида «undefined name в аннотации» там молча не воспроизводятся.
        python-version: [ "3.13", "3.14" ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest -q
